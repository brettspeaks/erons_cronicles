name: Compile Lore Repository

on:
  push:
    branches: [ main, master ] # Adjust to your default branch if different

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the compiled file back to the repo
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run compilation script
        run: python scripts/compile.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master-chronicles.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-compile master-chronicles.md [skip ci]" && git push)
